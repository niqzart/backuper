dotenv: backup.env

parameters:
  base_backup_folder:  # constant, always `backup`
    source: constant
    value: backup
  zip_password:  # required to be specified in environment
    source: environment
  server_username:  # required to be specified in environment
    source: environment
  server_password:  # required to be specified in environment
    source: environment
  server_host:  # required to be specified in environment
    source: environment
  archive_name:  # required to be specified as the first cli-argument
    source: cli-argument
    index: 0
  server_path:  # required to be specified as the second cli-argument
    source: cli-argument
    index: 1

actions:
  reshape-screenshots:  # uses pillow to convert images to webp (same quality, but better compression)
    type: reshape-images
    source: "./screenshots"
    replace_extension: true  # i.(png|jpg|...) -> i.webp
    # normally `.webp` is just appended (so same-name files, like `i.png` & `i.jpg` are kept separate),
    # but sometimes we know that all files are unique, so it's safe to replace the extension
    delete_original: true

  backup-from-pc:
    type: backup  # uses `robocopy /mir`
    source: "."
    target: "./${base_backup_folder}/pc"  # parameter substitution will turn this into `./backup/pc`
    exclude:
      directory_names:  # see robocopy's `/xd` argument
        - .git
        - venv
        - .mypy_cache
        - ${base_backup_folder}
      filename_patterns:  # see robocopy's `/xf` argument
        - "*.whl"
        - "*.tar.gz"
        - "*.7z.*"
    override_permissions: false  # see robocopy's `/b` argument

  execute-server-command:
    type: ssh  # uses `ssh`
    username: "${server_username}"
    password: "${server_password}"
    # you can also authorize via ssh-keys instead of username + password
    #   this can be configured in you system's `.ssh/config` file
    #   you can also specify the port in the config file instead of here
    host: "${server_host}"
    port: 2222  # default is 22, use this field if your server uses a custom ssh port
    command: >-
      echo
      "$$my_server_variable"
      >${server_path}/simple/wow.txt
      &&
      cat
      /etc/cool/*.txt
      >${server_path}/complex/cool.txt
    # the sting command to be passed to the remote server
    #   variables can be used in the command, and they will be substituted (ex. `${sever_path}` above)
    #   you can use `$$` to escape variable substitution and pass `$` to the remote sever
    #   using multiline commands is currently not supported, but use can use `&&`, `;` and `|`
    expected_exit_codes:
      - 0  # this is the default
      - 4  # some custom exit code which this script will count as a success
    # if the remote command exits with a different exit code,
    #   this step will error out and the execution will stop

  backup-from-server-simple:
    type: scp  # uses `scp -r`
    source:
      # you can also authorize via ssh-keys instead of username + password
      #   this can be configured in you system's `.ssh/config` file
      #   you can also specify the port in the config file instead of here
      username: "${server_username}"
      password: "${server_password}"
      host: "${server_host}"  # host is required for remote locations
      path: "${server_path}/simple/*"  # `*` is used not to get the last folder name in `server_path` added after `/server`
      port: 2222  # default is 22, use this field if your server uses a custom ssh port
    target:
      path: "./${base_backup_folder}/server/simple/"  # local targets should only contain the path
    bandwidth_limit: 4096  # limits bandwidth (download speed) to 4096 Kbit/s (512 KB/s)

  backup-from-server-complex:
    type: rsync-backup  # uses `rsync --recursive --delete --progress`
    source:
      username: "${server_username}"
      password: "${server_password}"
      # you can also authorize via ssh-keys instead of username + password
      #   this can be configured in you system's `.ssh/config` file
      #   you can also specify the port in the config file instead of here
      host: "${server_host}"  # host is required for remote locations
      path: "${server_path}/complex/*"  # `*` is used not to get the last folder name in `server_path` added after `/server`
      port: 2222  # default is 22, use this field if your server uses a custom ssh port
    target:
      path: "./${base_backup_folder}/server/complex/"  # local targets should only contain the path
    preserve_timestamps: true  # default, see rsync's `-t` argument
    use_transport_compression: true  # default, see rsync's `-z` argument
    override_partial_files: false  # default, see rsync's `--partial` argument (it's passed if `false`)
    bandwidth_limit: 512  # limits bandwidth (download speed) to 512 KB/S (4096 Kbit/s)
    remote_shell: "C:/ProgramData/chocolatey/lib/rsync/tools/bin/ssh.exe"
    # the ssh executable to use
    #   example for the one shipped with rsync installed via chocolatey (windows)
    #   some other "popular" options: `/usr/bin/ssh`, `path_to_cygwin/bin/ssh.exe`
    #   by default will use `ssh` (or wherever this alias leads to on your system)

  backup-from-android:  # uses `adb shell ls` & `adb pull` for robocopy-like backup
    type: from-android
    source: "/sdcard/Pictures"
    target: "${base_backup_folder}/android/pictures"
    filename_regex: "^(?!.trashed).*"  # excludes files in the recycle bin

  create-full-archive:
    type: compress
    source: "./${base_backup_folder}"
    archive_name: "${archive_name}"
    volume_size: 30k
    password: ${zip_password}
